# Configuración del Componente A del PPI (§2.2, fases 1 y 2).
#
# Todo el experimento queda descrito en este archivo versionado. Lo leen
# configuracion.cargar_config_particion y cargar_config_entrenamiento.
#
# Ojo con los números en notación científica: YAML lee `2e-5` como texto.
# Escribe siempre `2.0e-5`.

particion:
  # train / val / test. Las fracciones de prueba y validación deben poder
  # expresarse como 1/k (ver datos/particion.py).
  proporciones: [0.70, 0.10, 0.20]
  # Semilla de la PARTICIÓN, independiente de las semillas de entrenamiento:
  # la partición se congela una vez y no cambia entre corridas.
  semilla: 42

# --- BETO (ajustado y sonda) ------------------------------------------------

modelo_base: dccuchile/bert-base-spanish-wwm-cased
# Commit de refs/main en Hugging Face al 16 sep 2026. Fijarlo impide que una
# actualización del autor cambie el modelo entre corridas.
revision_modelo_base: c4d86612f51b4f46759c8390d1798c2febe71b93

max_length: 256
batch_size: 16              # lote efectivo del PPI
# Lote que cabe en memoria. 16 en Colab (T4, 16 GB); en una GPU de 4 GB usar 4,
# y el entrenamiento acumula 4 pasos para mantener el lote efectivo en 16.
batch_por_dispositivo: 16
learning_rate: 2.0e-5
weight_decay: 0.01
dropout: 0.1
max_epochs: 5
parada_temprana: {metrica: eval_loss, paciencia: 2}   # paciencia: el PPI no la fija

semillas: [13, 42, 77, 123, 2026]
arquitecturas: [beto_ajustado, beto_sonda, tfidf_lr]

# Desviación del PPI pendiente de aprobar (decisión D5): la sonda lineal con la
# tasa del ajuste fino apenas se entrena. Se elige la tasa en validación.
sonda:
  learning_rate: [1.0e-3, 5.0e-4, 1.0e-4]
  max_epochs: 20

# --- Baseline clásico -------------------------------------------------------

tfidf:
  ngram_max: 2        # unigramas y bigramas (PPI §2.2)
  C: 1.0              # el PPI no lo fija: valor por defecto de scikit-learn
  max_iter: 1000
